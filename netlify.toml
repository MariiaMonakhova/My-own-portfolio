# Netlify build configuration.
# Overrides the dashboard, so no manual settings are needed.

[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  # Pin Bun so local and Netlify builds match.
  BUN_VERSION = "1.3.14"
  # Netlify's build image defaults to Node 16; pin to 22 to silence the warning.
  NODE_VERSION = "22"

# Hashed assets (Bun adds a content hash to filenames) can be cached forever.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html should always be revalidated so new deploys show up immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
